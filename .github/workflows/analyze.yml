name: analyze
run-name: analyze ${{ inputs.reportId }}

on:
  workflow_dispatch:
    inputs:
      reportId:
        description: Random report id (22 chars)
        required: true
        type: string
      payload:
        description: Encrypted request (only this workflow can read it)
        required: true
        type: string

# No concurrency group: GitHub would cancel queued runs. Each run writes its own file.
permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REPORT_ID: ${{ inputs.reportId }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate report id
        id: validate
        run: |
          if ! [[ "$REPORT_ID" =~ ^[A-Za-z0-9_-]{22}$ ]]; then
            echo "Invalid reportId"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci --omit=dev

      - name: Analyze
        timeout-minutes: 10
        env:
          PAYLOAD: ${{ inputs.payload }}
          WORKFLOW_PRIVATE_KEY: ${{ secrets.WORKFLOW_PRIVATE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          KEY_FILE: ${{ runner.temp }}/report.key
        run: node collector/run.mjs

      - name: Write failure report
        if: failure()
        env:
          KEY_FILE: ${{ runner.temp }}/report.key
        run: node collector/fail.mjs

      - name: Commit report
        if: always() && steps.validate.outcome == 'success'
        run: |
          bash scripts/commit-report.sh "reports/$REPORT_ID.enc" "report: $REPORT_ID"
